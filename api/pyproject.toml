[project]
name = "api"
version = "0.1.0"
description = "An API for serving notes"
readme = "README.md"
authors = [
    { name = "Keannu Bernasol", email = "noehbernasol0@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.161.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
api = "api:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
